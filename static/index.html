<!doctype html>
<html>
    <head>
        <title>The Rego Playground</title>
        <link rel="stylesheet" href="output.css" />
        <link rel="icon" href="/images/favicon.ico" type="image/ico" />
        <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css"
        />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
        <script src="rego-mode.js"></script>
        <script src="index.js"></script>
        <link rel="stylesheet" href="custom.css" />
    </head>

    <body>
        <h1>Rego Playground</h1>
        <div class="container mx-auto">
            <div class="grid grid-cols-2 gap-5 mx-4">
                <div>
                    <label
                        for="package"
                        class="block text-md font-medium leading-6 text-gray-900"
                        >Rego Package</label
                    >
                    <textarea
                        class="Package px-2 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
                        rows="20"
                        cols="50"
                        form="playground"
                        id="package"
                        name="package"
                    ></textarea>
                </div>
                <div>
                    <button
                        class="inline-flex items-center rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
                        type="button"
                        id="format"
                    >
                        Format
                    </button>
                    <button
                        class="inline-flex items-center rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
                        type="submit"
                        form="playground"
                    >
                        Evaluate
                    </button>
                    <div class="mt-4">
                        <h2>Response</h2>
                        <pre><textarea readonly id="response" rows="12" cols="25"
						class="px-2 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"></textarea>
				</pre>
                    </div>
                    <form id="playground" method="POST">
                        <label
                            for="input"
                            class="block text-md font-medium leading-6 text-gray-900"
                            >Input</label
                        >
                        <textarea
                            rows="4"
                            cols="25"
                            form="playground"
                            id="input"
                            name="input"
                        >
                            {}</textarea
                        >
                        <label
                            for="data"
                            class="block text-md font-medium leading-6 text-gray-900"
                            >Data</label
                        >
                        <textarea
                            rows="4"
                            cols="25"
                            form="playground"
                            id="data"
                            name="data"
                        >
                            {}</textarea
                        >
                    </form>
                </div>
            </div>
        </div>
    </body>
</html>
